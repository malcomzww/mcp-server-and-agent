[project]
name = "mcp-server-and-agent"
version = "0.1.0"
description = "A hand-written MCP server at the protocol level, four agent topologies over it, and the failure rate of each measured under a controlled fault model."
requires-python = ">=3.11"
dependencies = [
    "llm-client-kit",
    "llm-eval-harness",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
mcp-server-and-agent = "mcp_server_and_agent.server:serve_stdio"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_and_agent"]

# Pinned to the v0.1.0 tags rather than to local paths so a fresh clone on a
# clean machine resolves without the rest of the portfolio checked out next to
# it. Both are frozen at v0.1.0; this repo consumes them, it does not fork them.
[tool.uv.sources]
llm-client-kit = { git = "https://github.com/malcomzww/llm-client-kit.git", tag = "v0.1.0" }
llm-eval-harness = { git = "https://github.com/malcomzww/llm-eval-harness.git", tag = "v0.1.0" }

[tool.pytest.ini_options]
pythonpath = ["src", "../llm-client-kit/src", "../llm-eval-harness/src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
